    <script>
        /* ========== 页面通用行为（主题 / 菜单 / 滚动 / 揭示） ========== */
        WJSite.initCommon();

        /* ========== 首页：最新文章预览 ========== */
        (function () {
            var grid = document.getElementById('homePosts');
            if (!grid) return;
            var Blog = window.WJBlog;

            Blog.list().then(function (posts) {
                var list = posts.slice(0, 3);

                /* 概览：把统计并进 Hero 的一行文字，避免再重复一块"最新文章"面板 */
                var meta = document.getElementById('heroMeta');
                if (meta) {
                    if (posts.length) {
                        var latest = posts.reduce(function (m, a) {
                            return a.updatedAt > m ? a.updatedAt : m;
                        }, '');
                        meta.textContent = '共 ' + posts.length + ' 篇文章 · 最近更新 ' + Blog.fmtRelative(latest);
                    } else {
                        meta.textContent = '还没有文章。';
                    }
                }

                if (!list.length) {
                    grid.innerHTML = '<div class="empty"><p>还没有文章。把文章 JSON 放进 ' +
                        '<code>articles/</code> 并更新 <code>articles/index.json</code> 后即可显示。</p></div>';
                    return;
                }
                grid.innerHTML = list.map(function (a, i) {
                    return Blog.cardHTML(a, { animate: true, delay: i * 60 });
                }).join('');
            }).catch(function () {
                grid.innerHTML = '<div class="empty"><p>文章加载失败，请检查 articles-data.js 是否已生成。</p></div>';
            });
        })();

        /* ========== 三体运动（真实牛顿引力 · 混沌模拟 · 3D） ========== */
        // 随机初始条件 + 牛顿引力实时积分（verlet）。三体问题对初值极度敏感，轨迹不可预测，
        // 每次刷新都是不同的"宇宙"；不做周期性重播种（保持连续演化），仅在数值发散时兜底重置。
        // 3D 呈现：轨道是真正的三维缠绕，带倾角的环绕相机 + 深度视差星空 + 近大远小透视 + 球体高光。
        // 三颗星体的运动同时驱动配乐：距离决定音高、动能决定音量与滤波，点击导航栏按钮开启。
        (function () {
            var canvas = document.getElementById('threeBody');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var host = canvas.parentElement;
            // 画质档位 0/1/2：0=省电（弱机/低内存），1=均衡（触屏/手机），2=全效（桌面）
            var _coarse = window.matchMedia('(pointer: coarse)').matches;
            var _cores = navigator.hardwareConcurrency || 8;
            var _mem = navigator.deviceMemory || 8;
            var tier = (_cores <= 4 || _mem <= 4) ? 0 : (_coarse ? 1 : 2);
            var DPR_CAP = [1.25, 1.5, 1.75][tier];
            var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
            var W = 0, H = 0;

            /* ---------------- 画质：会按实测帧率自动升降 ---------------- */
            var QUALITY = tier;                    // 运行时画质（0..tier）
            var FRAME_MS = 33, MAXP = 0, TRAIL = 120, BLOOM_ON = true;
            function applyQuality() {
                FRAME_MS = [41, 30, 22][QUALITY];  // 目标帧间隔（省电 / 均衡 / 全效）
                MAXP = [0, 26, 48][QUALITY];       // 每颗天体的粒子拖尾上限
                TRAIL = [90, 170, 260][QUALITY];   // 轨迹缓存点数（只影响观感）
                BLOOM_ON = QUALITY > 0;            // 省电档不做泛光
            }
            applyQuality();
            // 星空密度只按初始档位定一次：中途改变数量会让星空"跳变"
            var STAR_SCALE = [0.55, 1, 1.35][tier];

            /* ---------------- 主题：深空 / 亮色两套视觉 ---------------- */
            var COLORS = {
                dark: ['#54b8ff', '#ffc95c', '#ff6b8a'],
                light: ['#1668b8', '#a9741a', '#b8305c']
            };
            var THEME = 'dark', P = null, bgDirty = true, started = false;
            /** 首帧画完后再淡入，避免页面一上来就出现半成品 */
            function applyHostOpacity() {
                if (!host) return;
                host.style.opacity = started ? (THEME === 'light' ? '0.5' : '0.95') : '0';
            }
            function readTheme() {
                THEME = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                P = THEME === 'light'
                    ? { add: 'source-over', bgOn: false, bloom: 0, core: null, starMul: 0.5 }
                    : { add: 'lighter', bgOn: true, bloom: 0.9, core: '255,255,255', starMul: 1 };
                bgDirty = true;
                if (bodies) {
                    for (var i = 0; i < 3; i++) { if (bodies[i]) bodies[i].c = COLORS[THEME][i]; }
                }
                applyHostOpacity();
            }
            if (host) {
                host.style.transition = 'opacity 1.1s ease';
                host.style.opacity = '0';
            }
            readTheme();
            if (window.MutationObserver) {
                new MutationObserver(readTheme)
                    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
            }

            // 物理常量保持原样：G / SOFT / SUB_H / SPEED 不随视觉调整而改变
            var G = 1, SOFT = 0.1, SUB_H = 0.004, SPEED = 0.3;
            // 状态容器必须先于 resize() 建立：resize 里要判断"是否需要重建星场"，
            // 若声明晚于首次调用，首次 resize 会在 stars 还是 undefined 时读其 length 而抛错。
            var bodies = [], trail = [[], [], []], stars = [], parts = [[], [], []];

            /* ---------------- 离屏缓冲：深空底 + 泛光 ---------------- */
            var bgc = document.createElement('canvas'), bgx = bgc.getContext('2d');   // 缓存的深空底（仅暗色主题绘制）
            var blc = document.createElement('canvas'), blx = blc.getContext('2d');   // 低分辨率泛光缓冲
            // 泛光缓冲刻意取很低的分辨率：放大回全屏时本身就是柔和光晕，
            // 省掉每帧的全屏模糊滤镜（软件渲染下这一步非常昂贵）。
            var BLOOM_SCALE = [0.18, 0.26, 0.34][tier];

            function resize() {
                var oldArea = W * H;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                bgc.width = canvas.width;
                bgc.height = canvas.height;
                bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
                blc.width = Math.max(64, Math.round(canvas.width * BLOOM_SCALE));
                blc.height = Math.max(64, Math.round(canvas.height * BLOOM_SCALE));
                blx.setTransform(BLOOM_SCALE * dpr, 0, 0, BLOOM_SCALE * dpr, 0, 0);
                bgDirty = true;
                // 移动端地址栏收放会频繁触发 resize；面积变化很小时不重建星场，
                // 避免星空整体"跳"一下（重建后的随机位置与原来完全不同）
                if (!stars.length || Math.abs(W * H - oldArea) > oldArea * 0.08) stars = makeStars();
            }
            resize();
            var rsTimer = 0;
            window.addEventListener('resize', function () {
                clearTimeout(rsTimer);
                rsTimer = setTimeout(resize, 120);
            });

            function makeStars() {
                var N = Math.max(160, Math.min(900, Math.round(W * H / 5200 * STAR_SCALE)));
                var arr = [];
                for (var i = 0; i < N; i++) {
                    var d = Math.random();
                    arr.push({
                        x: Math.random(), y: Math.random(), depth: d,
                        tw0: Math.random() * 6.2832,
                        tws: 0.25 + Math.random() * 1.1,
                        sz: (0.35 + Math.random() * 0.9) * (0.55 + d),
                        warm: Math.random() < 0.16,      // 少量暖色星
                        blue: Math.random() < 0.22       // 少量偏蓝的星，避免整片死白
                    });
                }
                return arr;
            }
            function seed() {
                bodies = [];
                for (var i = 0; i < 3; i++) {
                    var rad = 0.35 + Math.random() * 0.75;
                    var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
                    var sp = 0.25 + Math.random() * 0.45;
                    var vth = Math.random() * Math.PI * 2, vph = Math.acos(2 * Math.random() - 1);
                    bodies.push({
                        x: Math.cos(th) * Math.sin(ph) * rad,
                        y: Math.sin(th) * Math.sin(ph) * rad,
                        z: Math.cos(ph) * rad,
                        vx: Math.cos(vth) * Math.sin(vph) * sp,
                        vy: Math.sin(vth) * Math.sin(vph) * sp,
                        vz: Math.cos(vph) * sp,
                        m: 0.8 + Math.random() * 0.5, c: COLORS[THEME][i]
                    });
                }
                var px = 0, py = 0, pz = 0, M = 0;
                for (var i = 0; i < 3; i++) { px += bodies[i].m * bodies[i].vx; py += bodies[i].m * bodies[i].vy; pz += bodies[i].m * bodies[i].vz; M += bodies[i].m; }
                for (var i = 0; i < 3; i++) { bodies[i].vx -= px / M; bodies[i].vy -= py / M; bodies[i].vz -= pz / M; }
                trail = [[], [], []];
                parts = [[], [], []];
                stars = makeStars();
            }
            seed();

            // 加速度缓冲复用：verlet 每个子步要算两次加速度，若每次都新建
            // 数组与对象，慢机上光是给 GC 擦屁股就够掉帧了。
            var _a0 = [{ x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }];
            var _a1 = [{ x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }];
            function accelInto(a) {
                for (var i = 0; i < 3; i++) { a[i].x = 0; a[i].y = 0; a[i].z = 0; }
                for (var i = 0; i < 3; i++) {
                    for (var j = 0; j < 3; j++) {
                        if (i === j) continue;
                        var dx = bodies[j].x - bodies[i].x,
                            dy = bodies[j].y - bodies[i].y,
                            dz = bodies[j].z - bodies[i].z;
                        var d2 = dx * dx + dy * dy + dz * dz + SOFT * SOFT;
                        var inv = 1 / Math.sqrt(d2);
                        var f = G * bodies[j].m * inv * inv * inv;
                        a[i].x += f * dx; a[i].y += f * dy; a[i].z += f * dz;
                    }
                }
                return a;
            }
            function verlet(h) {
                var a0 = accelInto(_a0);
                for (var i = 0; i < 3; i++) {
                    bodies[i].x += bodies[i].vx * h + 0.5 * a0[i].x * h * h;
                    bodies[i].y += bodies[i].vy * h + 0.5 * a0[i].y * h * h;
                    bodies[i].z += bodies[i].vz * h + 0.5 * a0[i].z * h * h;
                }
                var a1 = accelInto(_a1);
                for (var i = 0; i < 3; i++) {
                    bodies[i].vx += 0.5 * (a0[i].x + a1[i].x) * h;
                    bodies[i].vy += 0.5 * (a0[i].y + a1[i].y) * h;
                    bodies[i].vz += 0.5 * (a0[i].z + a1[i].z) * h;
                }
            }
            var _colCache = {};
            function hexA(hex, a) {
                var q = Math.max(0, Math.round(a * 32) / 32);
                var key = hex + q, s = _colCache[key];
                if (s === undefined) {
                    var n = parseInt(hex.slice(1), 16);
                    s = 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + q + ')';
                    _colCache[key] = s;
                }
                return s;
            }

            var simTime = 0, last = 0, rafOn = false, visible = true;
            var pageVisible = !document.hidden;   // 标签页是否在前台
            // 真实 rAF 间隔：用它判断机器能不能跑满，而不是用被主动节流后的绘制间隔
            var _rafPrev = 0, _rawSum = 0, _rawN = 0;
            function step(now) {
                if (!visible || !pageVisible) { rafOn = false; return; }
                requestAnimationFrame(step);
                if (_rafPrev) { _rawSum += now - _rafPrev; _rawN++; }
                _rafPrev = now;
                if (!last) last = now;
                var elapsed = now - last;
                if (elapsed < FRAME_MS) return;          // 主动降帧：省电档不追求 60fps
                var rdt = Math.min(elapsed / 1000, 0.05); last = now;
                var adv = SPEED * rdt;
                var a0 = accelInto(_a0);
                var maxA = 0;
                for (var i = 0; i < 3; i++) {
                    var am = Math.sqrt(a0[i].x * a0[i].x + a0[i].y * a0[i].y + a0[i].z * a0[i].z);
                    if (am > maxA) maxA = am;
                }
                var h = Math.min(SUB_H, 0.06 / Math.sqrt(maxA + 1e-6));
                var n = Math.max(1, Math.ceil(adv / h));
                if (n > 1500) { n = 1500; h = adv / n; }
                for (var s = 0; s < n; s++) { verlet(h); simTime += h; }
                for (var i = 0; i < 3; i++) {
                    var bd = bodies[i];
                    if (!isFinite(bd.x) || !isFinite(bd.y) || !isFinite(bd.z) ||
                        !isFinite(bd.vx) || !isFinite(bd.vy) || !isFinite(bd.vz)) { seed(); break; }
                }
                draw(rdt);
                trackQuality(now);
                updateAudio();
                if (audioReady && musicOn && now - pluckT > 6000) { pluckT = now; pluck(curFreq[Math.floor(Math.random() * 3)]); }
            }

            /* ===================== 渲染：深空星场 + 三体 + 泛光 ===================== */

            var fitScale = Math.min(W, H) * 0.24;
            var Rsmooth = 1;
            var drawDt = 1 / 60;
            var _tx = [], _ty = [], _tp = [];

            /** 与帧率无关的指数阻尼（tau = 时间常数，单位秒） */
            function damp(dt, tau) { return 1 - Math.exp(-dt / Math.max(tau, 1e-4)); }

            /** 深空底：只在尺寸或主题变化时重画一次，避免每帧重建渐变 */
            function paintBackground() {
                bgDirty = false;
                bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
                bgx.clearRect(0, 0, W, H);
                if (!P.bgOn) return;
                var ox = W * 0.5, oy = H * 0.42;
                var g = bgx.createRadialGradient(ox, oy, 0, ox, oy, Math.max(W, H) * 0.8);
                g.addColorStop(0, '#0c1424');
                g.addColorStop(0.42, '#070b14');
                g.addColorStop(1, '#03040a');
                bgx.fillStyle = g;
                bgx.fillRect(0, 0, W, H);
                // 三团极淡的星云，给纯黑底一点层次
                nebula(bgx, W * 0.16, H * 0.20, Math.min(W, H) * 0.55, '80,140,240', 0.05);
                nebula(bgx, W * 0.86, H * 0.76, Math.min(W, H) * 0.60, '220,100,160', 0.04);
                nebula(bgx, W * 0.50, H * 0.50, Math.min(W, H) * 0.80, '90,110,255', 0.035);
                // 暗角：把视觉重心收到中心，页面文字也更稳
                var v = bgx.createRadialGradient(ox, oy, Math.min(W, H) * 0.22, ox, oy, Math.max(W, H) * 0.78);
                v.addColorStop(0, 'rgba(0,0,0,0)');
                v.addColorStop(1, 'rgba(0,0,0,0.62)');
                bgx.fillStyle = v;
                bgx.fillRect(0, 0, W, H);
            }
            function nebula(c, x, y, r, rgb, a) {
                var g = c.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
                g.addColorStop(1, 'rgba(' + rgb + ',0)');
                c.fillStyle = g;
                c.fillRect(x - r, y - r, r * 2, r * 2);
            }

            /* ---- 粒子拖尾：随时间衰减的火花，由天体运动持续洒出 ---- */
            function spawnParts(i, x, y, r) {
                var arr = parts[i];
                if (MAXP === 0 || arr.length >= MAXP) return;
                var ang = Math.random() * 6.2832;
                var sp = 8 + Math.random() * 26;
                arr.push({
                    x: x, y: y,
                    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    ttl: 0.55 + Math.random() * 0.95, life: 1,
                    r: Math.max(0.6, r * (0.14 + Math.random() * 0.26)),
                    c: bodies[i].c
                });

            function stepParts(dt) {
                var drag = Math.exp(-dt * 2.4);
                for (var i = 0; i < 3; i++) {
                    var arr = parts[i];
                    for (var k = arr.length - 1; k >= 0; k--) {
                        var q = arr[k];
                        q.life -= dt / q.ttl;
                        if (q.life <= 0) { arr.splice(k, 1); continue; }
                        q.x += q.vx * dt; q.y += q.vy * dt;
                        q.vx *= drag; q.vy *= drag;
                    }
                }
            }

            /* ---- 预渲染的光晕精灵 ----
               每帧为每颗星/每个粒子新建径向渐变是这里最大的开销，
               改成一次性烘焙好的贴图，命中缓存直接 drawImage。 */
            var _sprites = {}, _rgbCache = {};
            function glowSprite(rgb) {
                var s = _sprites[rgb];
                if (s) return s;
                var size = 96, cv = document.createElement('canvas');
                cv.width = cv.height = size;
                var g2 = cv.getContext('2d');
                // 峰值 1、32% 处 0.38：与原来 haloInto 的衰减曲线一致
                var gr = g2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                gr.addColorStop(0, 'rgba(' + rgb + ',1)');
                gr.addColorStop(0.32, 'rgba(' + rgb + ',0.38)');
                gr.addColorStop(1, 'rgba(' + rgb + ',0)');
                g2.fillStyle = gr;
                g2.fillRect(0, 0, size, size);
                _sprites[rgb] = cv;
                return cv;
            }
            function hexRGB(hex) {
                var s = _rgbCache[hex];
                if (s) return s;
                var n = parseInt(hex.slice(1), 16);
                return (_rgbCache[hex] = ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255));
            }
            function glowAt(c, rgb, x, y, rad, alpha) {
                if (alpha <= 0.004 || rad <= 0) return;
                var prev = c.globalAlpha;
                c.globalAlpha = Math.min(1, prev * alpha);
                c.drawImage(glowSprite(rgb), x - rad, y - rad, rad * 2, rad * 2);
                c.globalAlpha = prev;
            }

            /** 天体本体：亮核 + 动态高光 + 背光暗边。光照方向由质心实时决定。
                每帧为每颗天体新建两个径向渐变（还要在主画布和泛光缓冲各画一遍）
                是整个渲染里最贵的一步，所以把"亮核 + 高光 + 暗边"一次性烘焙成贴图，
                绘制时只做一次旋转 + drawImage。 */
            var _bodySprites = {}, BODY_PX = 192;
            function bodySprite(col) {
                var key = col + '|' + (P.core || '');
                var cv = _bodySprites[key];
                if (cv) return cv;
                var U = BODY_PX / 2;
                var r = U / 1.5;              // 贴图里 r 对应实际半径，最外沿 1.5r 正好铺满
                cv = document.createElement('canvas');
                cv.width = cv.height = BODY_PX;
                var c2 = cv.getContext('2d');
                var off = r * 0.36;           // 高光沿 +x 偏移，绘制时按光照方向整体旋转
                var g = c2.createRadialGradient(U + off, U, r * 0.06, U, U, r * 1.35);
                g.addColorStop(0, P.core ? 'rgba(' + P.core + ',0.98)' : hexA(col, 0.98));
                g.addColorStop(0.36, hexA(col, 0.95));
                g.addColorStop(0.78, hexA(col, 0.5));
                g.addColorStop(1, hexA(col, 0.05));
                c2.fillStyle = g;
                c2.beginPath(); c2.arc(U, U, r * 1.35, 0, 6.2832); c2.fill();
                var sh = c2.createRadialGradient(U + off, U, r * 0.2, U, U, r * 1.5);
                sh.addColorStop(0, 'rgba(0,0,0,0)');
                sh.addColorStop(1, 'rgba(0,0,0,0.3)');
                c2.fillStyle = sh;
                c2.beginPath(); c2.arc(U, U, r * 1.5, 0, 6.2832); c2.fill();

                return cv;
            }
            function bodyInto(c, x, y, r, col, lx, ly) {
                if (r <= 0) return;
                var size = r * 3;                        // 贴图铺开后 1.5r 的外沿正好落在原位
                var ang = Math.atan2(ly, lx);            // atan2 内部已做归一化
                if (!ang) { c.drawImage(bodySprite(col), x - size / 2, y - size / 2, size, size); return; }
                c.save();
                c.translate(x, y);
                c.rotate(ang);
                c.drawImage(bodySprite(col), -size / 2, -size / 2, size, size);

            }

            // draw 每帧都跑：投影结果与绘制顺序复用同一组对象，避免持续分配
            var proj = [
                { x: 0, y: 0, persp: 1, r: 0, depth: 0, c: '', rx: 0, ry: 0, rz: 0 },
                { x: 0, y: 0, persp: 1, r: 0, depth: 0, c: '', rx: 0, ry: 0, rz: 0 },
                { x: 0, y: 0, persp: 1, r: 0, depth: 0, c: '', rx: 0, ry: 0, rz: 0 }
            ];
            var drawOrder = [0, 1, 2];

            function draw(dt) {
                if (dt) drawDt = dt;
                var i, k, s, t, p;

                /* ---------- 相机：质心居中 + 随规模平滑缩放 ---------- */
                var cx = 0, cy = 0, cz = 0;
                for (i = 0; i < 3; i++) { cx += bodies[i].x; cy += bodies[i].y; cz += bodies[i].z; }
                cx /= 3; cy /= 3; cz /= 3;
                var R = 0;
                for (i = 0; i < 3; i++) {
                    var dist = Math.hypot(bodies[i].x - cx, bodies[i].y - cy, bodies[i].z - cz);
                    if (dist > R) R = dist;
                }
                Rsmooth += (R - Rsmooth) * damp(drawDt, 0.45);
                var span = Math.min(W, H);
                var targetS = (span * 0.40) / Math.max(Math.min(Rsmooth, 9) * 1.15, 0.55);
                targetS = Math.max(span * 0.045, Math.min(targetS, span * 1.15));  // 极端散开时也不至于缩成一点
                fitScale += (targetS - fitScale) * damp(drawDt, 0.26);

                // 持续环绕 + 缓慢俯仰：同一段混沌轨道在多个角度下更易辨认
                var ay = simTime * 0.26;
                var ax = 0.62 + Math.sin(simTime * 0.055) * 0.17;
                var cyr = Math.cos(ay), syr = Math.sin(ay), cxr = Math.cos(ax), sxr = Math.sin(ax);
                var camZ = Math.max(2.4, Rsmooth * 1.45), S = fitScale;

                /* ---------- 深空底 ---------- */
                if (bgDirty) paintBackground();
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                // 底图是不透明的整屏绘制，bgOn 时它自己就会覆盖掉上一帧，
                // 多做一次全屏 clearRect 只是白写一整屏像素
                if (P.bgOn) ctx.drawImage(bgc, 0, 0, W, H);

                /* ---------- 星空：深度视差 + 闪烁 ---------- */

                var tileW = W * 1.3, tileH = H * 1.3;
                var mW = (tileW - W) / 2, mH = (tileH - H) / 2;
                for (s = 0; s < stars.length; s++) {
                    var st = stars[s];
                    var par = 0.22 + 0.9 * st.depth;
                    var sxp = (((st.x * tileW + ay * 62 * par) % tileW) + tileW) % tileW - mW;
                    var syp = (((st.y * tileH + (bobY + ax) * 62 * par) % tileH) + tileH) % tileH - mH;
                    var twk = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(simTime * st.tws + st.tw0));
                    var sa = twk * (0.2 + 0.75 * st.depth) * P.starMul;
                    if (sa <= 0.014) continue;
                    var sr = st.sz * (0.55 + 0.8 * st.depth) * 0.85;
                    var base = P.bgOn
                        ? (st.warm ? '255,226,180' : (st.blue ? '190,220,255' : '226,238,255'))
                        : '58,72,108';
                    if (st.depth > 0.86) glowAt(ctx, base, sxp, syp, sr * 6, sa * 0.5);   // 亮星带一圈柔和星芒
                    ctx.fillStyle = 'rgba(' + base + ',' + sa.toFixed(3) + ')';
                    ctx.beginPath(); ctx.arc(sxp, syp, sr, 0, 6.2832); ctx.fill();
                }

                /* ---------- 天体投影 ---------- */
                for (i = 0; i < 3; i++) {
                    var b = bodies[i];
                    var rx = b.x - cx, ry = b.y - cy, rz = b.z - cz;
                    var x1 = rx * cyr + rz * syr, z1 = -rx * syr + rz * cyr, y1 = ry;
                    var y2 = y1 * cxr - z1 * sxr, z2 = y1 * sxr + z1 * cxr;
                    var persp = camZ / (camZ - z2);
                    var pj = proj[i];
                    pj.x = W / 2 + x1 * S * persp;
                    pj.y = H / 2 + y2 * S * persp;
                    pj.persp = persp;
                    pj.r = Math.max(2.4, S * 0.052 * persp);
                    pj.depth = z2;
                    pj.c = b.c;
                    pj.rx = rx; pj.ry = ry; pj.rz = rz;
                }
                for (i = 0; i < 3; i++) {
                    trail[i].push({ x: proj[i].rx, y: proj[i].ry, z: proj[i].rz });
                    if (trail[i].length > TRAIL) trail[i].shift();
                    spawnParts(i, proj[i].x, proj[i].y, proj[i].r);
                }

                /* ---------- 轨迹：单层亮芯（按亮度分档） ----------
                   不做外层辉光，轨道是一条干净的实线；分档合批把每帧上千次 stroke
                   压到几十次，移动端也能跑满帧。 */
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                    if (tn < 2) continue;
                    while (_tx.length < tn) { _tx.push(0); _ty.push(0); _tp.push(0); }
                    for (t = 0; t < tn; t++) {
                        p = tp[t];
                        var px1 = p.x * cyr + p.z * syr, pz1 = -p.x * syr + p.z * cyr, py1 = p.y;
                        var py2 = py1 * cxr - pz1 * sxr, pz2 = py1 * sxr + pz1 * cxr;
                        var pp = camZ / (camZ - pz2);
                        _tx[t] = W / 2 + px1 * S * pp; _ty[t] = H / 2 + py2 * S * pp; _tp[t] = pp;
                    }
                    var col = bodies[i].c, brr = proj[i].r;
                    var wb, lo, hi, mid, cnt, depSum;
                    for (wb = 0; wb < ABUCK; wb++) {
                        lo = wb / ABUCK; hi = (wb + 1) / ABUCK; mid = (lo + hi) / 2;
                        ctx.beginPath(); cnt = 0; depSum = 0;
                        for (t = 1; t < tn; t++) {
                            var fa = t / tn;
                            if (fa <= lo || fa > hi) continue;
                            ctx.moveTo(_tx[t - 1], _ty[t - 1]);
                            ctx.lineTo(_tx[t], _ty[t]);
                            depSum += 0.5 * (_tp[t - 1] + _tp[t]);
                            cnt++;
                        }
                        if (!cnt) continue;
                        var depc = Math.max(0.4, Math.min(1.7, depSum / cnt));
                        // 去掉外层辉光后线宽略微加粗，让轨道仍看得清
                        ctx.lineWidth = Math.max(0.7, brr * 0.46 * mid * depc);
                        ctx.strokeStyle = hexA(col, 0.9 * mid * mid * coreMul);
                        ctx.stroke();
                    }
                }

                /* ---------- 三方连线：很淡，帮助看清三者的相对关系 ---------- */
                ctx.strokeStyle = P.bgOn ? 'rgba(200,220,255,0.10)' : 'rgba(80,100,150,0.16)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(proj[0].x, proj[0].y);
                ctx.lineTo(proj[1].x, proj[1].y);
                ctx.lineTo(proj[2].x, proj[2].y);
                ctx.closePath();
                ctx.stroke();

                /* ---------- 粒子拖尾 ---------- */
                stepParts(drawDt);
                for (i = 0; i < 3; i++) {
                    var pa = parts[i];
                    for (k = 0; k < pa.length; k++) {
                        var q = pa[k];
                        glowAt(ctx, hexRGB(q.c), q.x, q.y,
                            q.r * (1 + 1.5 * q.life), q.life * q.life * (P.bgOn ? 0.8 : 0.55));
                    }
                }

                /* ---------- 天体：远的先画；高光朝向质心，随运动实时偏移 ----------
                   不再在球体周围铺一层大范围光晕，本体贴图的柔和边缘就够用，
                   三颗球看起来是"实体"而不是一团发光的雾。 */
                var order = drawOrder.sort(function (a, b) { return proj[a].depth - proj[b].depth; });
                var lcx = W / 2, lcy = H / 2;
                for (k = 0; k < 3; k++) {
                    i = order[k];
                    var pj = proj[i];
                    var br = pj.r * (0.9 + 0.18 * Math.min(1, 1.7 - pj.persp));
                    bodyInto(ctx, pj.x, pj.y, br, pj.c, lcx - pj.x, lcy - pj.y);
                }

                /* ---------- 泛光：低分辨率缓冲 → 模糊 → 叠加 ----------
                   只让粒子尘埃参与，天体本体不再进缓冲 —— 否则放大回来的柔光
                   又会绕着三颗球形成一圈光晕。 */
                if (BLOOM_ON && P.bloom > 0) {
                    blx.globalCompositeOperation = 'source-over';
                    blx.clearRect(0, 0, W, H);
                    blx.globalCompositeOperation = 'lighter';
                    for (i = 0; i < 3; i++) {
                        var pq = parts[i];
                        for (k = 0; k < pq.length; k++) {
                            var qb = pq[k];
                            glowAt(blx, hexRGB(qb.c), qb.x, qb.y, qb.r * 2.6, qb.life * 0.55);
                        }
                    }
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = P.bloom;
                    ctx.drawImage(blc, 0, 0, W, H);   // 低分缓冲放大本身就是柔光，不需要滤镜
                    ctx.globalAlpha = 1;
                }

                ctx.globalCompositeOperation = 'source-over';
                if (!started) { started = true; applyHostOpacity(); }   // 首帧就绪后再淡入
            }

            /* ---------------- 帧率自适应：慢则降档，快则升档 ----------------
               指标取真实 rAF 间隔：主动降帧后绘制间隔会稳定贴在目标值上，
               若拿它当依据，均衡档（目标 30fps）会被永远判成"卡顿"而降到省电档。 */
            var _qHold = 0;
            function trackQuality(now) {

                _rawSum = 0; _rawN = 0;
                if (now < _qHold) return;                       // 档位切换后先稳定一会儿，避免来回抖

                else if (raw < 18.5 && QUALITY < tier) { QUALITY++; applyQuality(); _qHold = now + 6000; }
            }

            /* ===================== 音频：三体运动 → 太空纯音乐 ===================== */
            var SCALES = {
                Lydian: [0, 2, 4, 6, 7, 9, 11], MajorPenta: [0, 2, 4, 7, 9],
                MinorPenta: [0, 3, 5, 7, 10], WholeTone: [0, 2, 4, 6, 8, 10],
                Aeolian: [0, 2, 3, 5, 7, 8, 10]
            };
            var actx = null, master = null, reverb = null, wet = null, dry = null,
                voices = [], audioReady = false, musicOn = false, lastBell = 0, pluckT = 0;
            var ROOT = 110, scaleName = 'Lydian', vol = 0.55, curFreq = [ROOT * 2, ROOT * 4, ROOT * 8];

            function makeReverb(ac, sec, decay) {
                var rate = ac.sampleRate, len = Math.floor(rate * sec);
                var buf = ac.createBuffer(2, len, rate);
                for (var ch = 0; ch < 2; ch++) {
                    var d = buf.getChannelData(ch);
                    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
                }

            }
            function makeVoice(ac, dest) {

                var o2 = ac.createOscillator(); o2.type = 'triangle'; o2.detune.value = 4;
                var filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420; filt.Q.value = 0.4;
                var g = ac.createGain(); g.gain.value = 0;

                o1.connect(filt); o2.connect(filt); filt.connect(g);
                if (pan) { g.connect(pan); pan.connect(dest); } else { g.connect(dest); }
                o1.start(); o2.start();
                return { o1: o1, o2: o2, filt: filt, g: g, pan: pan };
            }
            function makeNoisePad(ac, dest) {
                var len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate);
                var d = buf.getChannelData(0);
                for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
                var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
                var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 440; bp.Q.value = 0.6;
                var g = ac.createGain(); g.gain.value = 0.025;
                var lfo = ac.createOscillator(); lfo.frequency.value = 0.05;
                var lg = ac.createGain(); lg.gain.value = 70;

                src.connect(bp); bp.connect(g); g.connect(dest);

            }
            function initAudio() {
                if (audioReady) return;
                actx = new (window.AudioContext || window.webkitAudioContext)();
                master = actx.createGain(); master.gain.value = 0;
                reverb = makeReverb(actx, 6, 3.0);
                wet = actx.createGain(); wet.gain.value = 0.62;
                dry = actx.createGain(); dry.gain.value = 0.6;
                master.connect(dry); dry.connect(actx.destination);
                master.connect(reverb); reverb.connect(wet); wet.connect(actx.destination);
                for (var i = 0; i < 3; i++) voices.push(makeVoice(actx, master));
                makeNoisePad(actx, master);
                var rd = actx.createOscillator(); rd.type = 'sine'; rd.frequency.value = ROOT;
                var rg = actx.createGain(); rg.gain.value = 0.06; rd.connect(rg); rg.connect(master); rd.start();
                audioReady = true;
            }
            function scaleFreq(name, deg) {
                var s = SCALES[name], n = s.length;
                var oct = Math.floor(deg / n), idx = ((deg % n) + n) % n;
                return ROOT * Math.pow(2, (s[idx] + 12 * oct) / 12);
            }
            function bell(f) {
                if (!audioReady || !musicOn) return;
                var t = actx.currentTime;
                var o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
                var o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.01;
                var g = actx.createGain();
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
                var g2 = actx.createGain(); g2.gain.value = 0.1;
                o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
                o.start(t); o2.start(t); o.stop(t + 3.1); o2.stop(t + 3.1);
            }
            function pluck(f) {
                if (!audioReady || !musicOn) return;
                var t = actx.currentTime;
                var o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
                var g = actx.createGain();
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.10, t + 0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
                o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.9);
            }
            function updateAudio() {
                if (!audioReady) return;
                var now = actx.currentTime;
                var cx = 0, cy = 0, cz = 0;
                for (var i = 0; i < 3; i++) { cx += bodies[i].x; cy += bodies[i].y; cz += bodies[i].z; }
                cx /= 3; cy /= 3; cz /= 3;
                var sLen = SCALES[scaleName].length, reg = [1, 2, 3], ke = 0;
                for (var i = 0; i < 3; i++) {
                    var b = bodies[i];
                    var rx = b.x - cx, ry = b.y - cy, rz = b.z - cz;
                    var r = Math.sqrt(rx * rx + ry * ry + rz * rz);
                    var t = Math.max(0, Math.min(1, (r - 0.2) / 2.3));
                    var deg = reg[i] * sLen + Math.round(t * (sLen - 1));
                    var f = scaleFreq(scaleName, deg); curFreq[i] = f;
                    var v = voices[i];
                    v.o1.frequency.setTargetAtTime(f, now, 0.18);
                    v.o2.frequency.setTargetAtTime(f, now, 0.18);
                    if (v.pan) v.pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, rx * 1.2)), now, 0.15);
                    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy + b.vz * b.vz);
                    ke += 0.5 * b.m * sp * sp;
                    v.filt.frequency.setTargetAtTime(320 + Math.min(sp, 1.6) * 900, now, 0.25);
                    v.g.gain.setTargetAtTime(musicOn ? 0.085 : 0, now, 0.4);
                }
                var intensity = Math.max(0, Math.min(1.6, ke / 1.2));
                master.gain.setTargetAtTime(musicOn ? vol * (0.7 + 0.3 * Math.min(intensity, 1)) : 0, now, 0.5);
                var minD = 1e9;
                for (var i = 0; i < 3; i++) for (var j = i + 1; j < 3; j++) {
                    var dx = bodies[j].x - bodies[i].x, dy = bodies[j].y - bodies[i].y, dz = bodies[j].z - bodies[i].z;
                    var d = Math.sqrt(dx * dx + dy * dy + dz * dz); if (d < minD) minD = d;
                }
                if (musicOn && minD < 0.35 && now - lastBell > 1.2) {
                    lastBell = now; bell(scaleFreq(scaleName, 3 * sLen + Math.floor(Math.random() * sLen)));
                }
                return { intensity: intensity, minD: minD };
            }
            (function wireOpen() {
                var ob = document.getElementById('openBtn');
                if (!ob) return;
                ob.addEventListener('click', function () {
                    initAudio();
                    if (actx.state === 'suspended') actx.resume();
                    musicOn = !musicOn;
                    ob.classList.toggle('on', musicOn);
                    ob.textContent = musicOn ? '关闭音乐' : '开启音乐';
                });
            })();

            // 切到后台标签页时 rAF 本来就会被浏览器暂停，但回来时时间戳会跳一大截，
            // 容易污染上面的帧率采样、把好机器误判成"跑不动"而降档。
            // 这里显式暂停并清空计时基准，恢复时和首次启动走同一条路径。
            document.addEventListener('visibilitychange', function () {
                pageVisible = !document.hidden;
                if (pageVisible && visible && !rafOn) {
                    rafOn = true; last = 0; _rafPrev = 0; _rawSum = 0; _rawN = 0;
                    requestAnimationFrame(step);
                }
            });

            // 仅在画布所在层可见时运行，离开视口暂停，省 CPU
            if ('IntersectionObserver' in window) {
                new IntersectionObserver(function (es) {
                    visible = es[0].isIntersecting;
                    if (visible && !rafOn) {
                        // 暂停期间 rAF 也停了，时间戳不再连续：恢复时清空计时基准，
                        // 否则第一帧会被算成一个巨大的间隔，直接误触发降档
                        rafOn = true; last = 0; _rafPrev = 0; _rawSum = 0; _rawN = 0;
                        requestAnimationFrame(step);
                    }
                }, { threshold: 0 }).observe(host);
            } else {
                rafOn = true; requestAnimationFrame(step);
            }
        })();
    </script>

</body>
