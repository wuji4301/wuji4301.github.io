<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>编辑器 · 无极博客</title>
    <meta name="description" content="本地文章编辑器：Markdown、LaTeX 公式、代码高亮与图片" />
    <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101114'/%3E%3Ctext x='50' y='71' font-size='58' font-weight='600' text-anchor='middle' fill='%23f2f2f2' font-family='PingFang SC,Microsoft YaHei,sans-serif'%3E%E6%97%A0%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/articles.css" />
    <link rel="stylesheet" href="admin.css" />
    <script>
        // 防首屏闪烁（FOUC）：在 <body> 解析前定好主题
        (function () {
            try {
                var saved = localStorage.getItem('wj-theme');
                var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="bg-fx no-grid" aria-hidden="true"></div>
    <a class="skip-link" href="#editorHost">跳到编辑器</a>

    <!-- 编辑器复用后台顶栏，保持与管理页面一致的观感 -->
    <header class="admin-top admin-top--editor">
        <div class="admin-top-lead">
            <a class="brand" href="index.html">
                <span class="mark">无J</span>
                <span>无极</span>
            </a>
            <span class="admin-side-tag">编辑器</span>
            <div class="admin-crumb">
                <b id="editorTitle">新文章</b>
                <span id="editorStatus">本地保存 · 不上传</span>
            </div>
        </div>
        <div class="admin-top-actions">
            <button class="btn btn-ghost btn-sm" id="aiBtn" type="button">AI 写稿</button>
            <button class="btn btn-ghost btn-sm" id="previewBtn" type="button">预览</button>
            <button class="btn btn-ghost btn-sm" id="exportBtn" type="button">导出</button>
            <button class="btn btn-ghost btn-sm" id="newBtn" type="button">新建</button>
            <button class="btn btn-ghost btn-sm" id="listBtn" type="button">后台</button>
            <button class="btn btn-ghost btn-sm" id="selftestBtn" type="button">自测</button>
            <button class="btn btn-danger btn-sm" id="deleteBtn" type="button" hidden>删除</button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换深浅色">☾</button>
            <button class="btn btn-primary btn-sm" id="saveTopBtn" type="button">保存</button>
        </div>
    </header>

    <main class="admin-content admin-content--editor">
        <div class="notice" id="originNotice" hidden style="margin-bottom:16px">
            <div>
                这篇文章来自仓库（所有访客可见）。你在这里的修改会保存为<b>本地副本</b>并覆盖显示，
                不会影响仓库文件；导出后提交即可正式更新。
            </div>
        </div>

        <div id="editorHost"></div>
    </main>

    <!-- 文章数据：用 script 标签载入（file:// 直接打开也能读到；编辑器本身不依赖它） -->
    <script src="../articles-data.js" data-wj-asset-base="../"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/markdown.js"></script>
    <script src="../assets/js/math.js"></script>
    <script src="../assets/js/convert.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/export-pdf.js"></script>
    <script src="../assets/js/editor.js"></script>
    <!-- AI 模块只在后台页面加载，公开页不引入（见 tools/test-assets.mjs） -->
    <script src="js/ai.js"></script>
    <script src="js/editor-page.js"></script>
</body>
</html>
