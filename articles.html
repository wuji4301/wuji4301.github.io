<body>

        <div class="nav-links">
            <a href="index.html">首页</a>

    <main class="wrap" id="mainContent">
        <header class="page-head reveal">
            <div class="head-row">
                <div>
                    <h1>文章</h1>
                </div>
            </div>
        </header>

        <!-- 搜索 / 排序 -->
        <div class="list-toolbar reveal" style="--rd:.06s">
            <div class="search-box">
                <input class="input" id="searchInput" type="search" placeholder="搜索标题、摘要、标签或正文…" aria-label="搜索文章">
            </div>
            <select class="select" id="sortSelect" aria-label="排序方式">
                <option value="updated">最近更新</option>
                <option value="created">创建时间</option>
                <option value="title">标题</option>
            </select>
        </div>

        <div class="tag-filter" id="tagFilter" hidden></div>

        <div class="post-grid" id="postGrid" aria-live="polite"></div>

        <!-- 空态 -->
        <div class="empty" id="emptyBox" hidden>
            <p id="emptyText">还没有文章。</p>
        </div>

        <div class="notice" id="repoWarn" hidden style="margin-top:26px">
            <div>
                文章数据来源于 <code>articles/index.json</code>。若这里没有列出文章，请确认仓库
                <code>articles/</code> 目录下存在清单文件与对应的文章 JSON。
            </div>
        </div>
    </main>

    <footer class="footer reveal">
        <div class="wrap footer-inner">

                </a>
                <p>路在脚下</p>
            </div>
            <nav class="f-links" aria-label="页脚导航">
                <a href="index.html">首页</a>
                <a href="articles.html">文章</a>
                <a href="https://github.com/wuji4301" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>

    <button class="to-top" id="toTop" aria-label="返回顶部">↑</button>

    <script src="articles-data.js"></script>
    <script src="assets/js/blog.js"></script>
    <script src="assets/js/site.js"></script>
    <script>
        (function () {
            'use strict';
            var Blog = window.WJBlog;

            WJSite.initCommon();

            var grid = document.getElementById('postGrid');
            var emptyBox = document.getElementById('emptyBox');
            var emptyText = document.getElementById('emptyText');
            var tagFilter = document.getElementById('tagFilter');
            var searchInput = document.getElementById('searchInput');
            var sortSelect = document.getElementById('sortSelect');
            var repoWarn = document.getElementById('repoWarn');

            var all = [];             // 全部已发布文章
            var activeTags = [];      // 选中的标签（多选）
            var query = '';
            var firstPaint = true;    // 首屏用较长的错落动画，之后用短促的过渡
            var cardSeq = 0;
            var lastSig = null;       // 上一次渲染的列表指纹，用来跳过无谓的 DOM 重建

            function currentList() {
                var q = query.trim().toLowerCase();
                var tags = activeTags;
                var list = all.filter(function (a) {
                    if (tags.length && !tags.every(function (t) { return a.tags.indexOf(t) !== -1; })) return false;
                    if (!q) return true;
                    return Blog.haystack(a).indexOf(q) !== -1;
                });
                var mode = sortSelect.value;
                list.sort(function (x, y) {
                    if (!!y.pinned !== !!x.pinned) return (y.pinned ? 1 : 0) - (x.pinned ? 1 : 0);
                    if (mode === 'title') return x.title.localeCompare(y.title, 'zh-Hans-CN');
                    if (mode === 'created') return String(y.createdAt).localeCompare(String(x.createdAt));
                    return String(y.updatedAt).localeCompare(String(x.updatedAt));
                });
                return list;
            }

            function renderTagFilter() {
                var counts = {};
                all.forEach(function (a) {
                    a.tags.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
                });
                var tags = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
                if (!tags.length) { tagFilter.hidden = true; return; }
                tagFilter.hidden = false;
                tagFilter.innerHTML = tags.map(function (t) {
                    return '<button type="button" class="tag' + (activeTags.indexOf(t) !== -1 ? ' on' : '') +
                        '" data-tag="' + Blog.esc(t) + '">' + Blog.esc(t) +
                        ' <span style="opacity:.6">' + counts[t] + '</span></button>';
                }).join('');
            }

            /* 重排位移（FLIP）

               改排序或切标签会整块重建列表，位置其实没变的卡片也跟着重播一次入场，
               看起来像整页刷新。这里在重建前记下每张卡片的矩形，重建后让"上一版就在、
               这一版还在"的卡片从旧位置滑到新位置 —— 只有真正新出现的卡片才播入场。
               同一批内容只是换了位置，就该看起来是"移动"，而不是"重新来过"。

               用 href 做身份键：它由 articleURL(a) 生成，同一篇文章必然得到同一个值。
               位移交给 WAAPI：它自己合成这一层的 transform，不用挂 will-change，
               也不会和 .card-in 的 CSS 动画抢同一个属性（留下的卡片根本不挂 .card-in）。 */
            function captureRects() {
                var map = {};
                Array.prototype.forEach.call(grid.children, function (el) {
                    if (el.classList && el.classList.contains('post-card')) {
                        map[el.getAttribute('href')] = el.getBoundingClientRect();
                    }
                });
                return map;
            }

            function playFlip(before) {
                var moves = [];
                Array.prototype.forEach.call(grid.children, function (el) {
                    var from = before[el.getAttribute && el.getAttribute('href')];
                    if (!from || !el.animate) return;
                    var to = el.getBoundingClientRect();
                    var dx = from.left - to.left;
                    var dy = from.top - to.top;
                    if (!dx && !dy) return;              // 没挪窝的不用动
                    moves.push([el, dx, dy]);
                });
                for (var i = 0; i < moves.length; i++) {
                    moves[i][0].animate([
                        { transform: 'translate(' + moves[i][1] + 'px,' + moves[i][2] + 'px)' },
                        { transform: 'none' }
                    ], { duration: 340, easing: 'cubic-bezier(.16,1,.3,1)' });
                }
            }

            function render() {
                var list = currentList();
                var sig = list.map(function (a) { return a.id || a.slug || a.title; }).join('\u0001');

                // 列表没有实质变化（例如输入后又删回原样、切标签但结果一致）时直接跳过
                // DOM 重建：省掉图片的重新解码与整块重排，标签按钮的状态照常刷新。
                if (sig !== lastSig) {
                    lastSig = sig;
                    var entering = firstPaint;
                    firstPaint = false;
                    cardSeq = 0;
                    // 首屏错落 40ms（最多 8 档），二次筛选收紧到 22ms（最多 6 档）：
                    // 输入时的反馈要快，又保留一点自上而下的方向感。
                    var step = entering ? 40 : 22;
                    var cap = entering ? 8 : 6;
                    // 首屏没有"上一版"可比，自然不做位移
                    var before = entering ? null : captureRects();
                    grid.innerHTML = list.map(function (a) {
                        // 上次就在、这次还在的卡片走位移过渡，不播入场
                        if (before && before[Blog.articleURL(a)])
                            return Blog.cardHTML(a, { animate: false });
                        // 新出现的才排进错落；序号只给它们递增，不被留下的卡片占位
                        return Blog.cardHTML(a, {
                            animate: true,
                            quick: !entering,
                            delay: Math.min(cardSeq++, cap) * step
                        });
                    }).join('');
                    if (before) playFlip(before);
                    emptyBox.hidden = list.length > 0;
                    if (!list.length) {
                        emptyText.textContent = all.length
                            ? '没有匹配的文章，换个关键词或取消标签筛选试试。'
                            : '还没有文章。把文章 JSON 放进 articles/ 目录并更新 articles/index.json 后即可显示。';
                    }
                }
                renderTagFilter();
            }

            tagFilter.addEventListener('click', function (e) {
                var b = e.target.closest('[data-tag]');
                if (!b) return;
                var t = b.dataset.tag;
                var i = activeTags.indexOf(t);
                if (i === -1) activeTags.push(t); else activeTags.splice(i, 1);
                render();
            });

            var searchTimer = 0;
            searchInput.addEventListener('input', function () {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function () { query = searchInput.value; render(); }, 120);
            });
            sortSelect.addEventListener('change', render);

            // 支持 ?tag=xxx 直达筛选
            var m = /[?&]tag=([^&]+)/.exec(location.search);
            if (m) { activeTags = [decodeURIComponent(m[1])]; }

            Blog.list().then(function (posts) {
                all = posts;
                repoWarn.hidden = all.length > 0;
                render();
            }).catch(function (err) {
                grid.innerHTML = '';
                emptyBox.hidden = false;
                emptyText.textContent = '加载失败：' + err.message;
            });
        })();
    </script>
</body>
</html>
